name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'

permissions:
  contents: read
  pull-requests: write


jobs:
  # =========================================
  # 1. キャッシュ構築専用ジョブ
  # =========================================
  setup-cache:
    runs-on: ubuntu-latest
    outputs:
      pnpm_store_path: ${{ steps.pnpm-cache.outputs.store-path }}
      pw_cache_key: ${{ steps.pw.outputs.key }}

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      # pnpm store のパス取得
      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "store-path=$(pnpm store path)" >> $GITHUB_OUTPUT

      # 依存をここで一度だけ解決
      - name: Install dependencies (single source of truth)
        run: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 pnpm i --frozen-lockfile

      # node_modules + pnpm store キャッシュ
      - name: Cache node_modules + pnpm store
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            ~/.pnpm-store
          key: node-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # Playwright version取得
      - name: Get Playwright version
        id: pw
        run: echo "key=node-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}" >> $GITHUB_OUTPUT

      # Playwright browser cache
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.pw.outputs.key }}

      # browser install（ここで1回だけ実行）
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps


  # =========================================
  # 2. lint / unit test（キャッシュ利用）
  # =========================================
  test:
    needs: setup-cache
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Restore pnpm cache
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            ~/.pnpm-store
          key: node-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Run check
        run: pnpm check

      - name: Run unit tests
        run: pnpm test --coverage --reporter=default --reporter=github-actions


  # =========================================
  # 3. E2E（matrix + キャッシュ再利用）
  # =========================================
  e2e:
    needs: [test, setup-cache]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      # 依存復元（installはしない）
      - name: Restore dependencies cache
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            ~/.pnpm-store
          key: node-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # Playwright browser cache復元
      - name: Restore Playwright cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ needs.setup-cache.outputs.pw_cache_key }}

      - name: Run Playwright tests
        run: pnpm run e2e --project=${{ matrix.browser }}

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 30
